---
# Configuration file for MegaLinter.
# See configuration options at https://oxsecurity.github.io/megalinter/configuration/ and more in each linter documentation.

# General
PRINT_ALPACA: false
APPLY_FIXES: all

DISABLE_ERRORS: false
SHOW_ELAPSED_TIME: true
SHOW_SKIPPED_LINTERS: false

ADDITIONAL_EXCLUDED_DIRECTORIES:
  - "workflows"

# Reporter options
CLEAR_REPORT_FOLDER: true
EMAIL_REPORTER: false
TEXT_REPORTER: true
SARIF_REPORTER: true
GITHUB_COMMENT_REPORTER: false
GITHUB_STATUS_REPORTER: true
GITLAB_COMMENT_REPORTER: false
UPDATED_SOURCES_REPORTER: true

# Lint specific settings
ENABLE_LINTERS:
  [
    BASH_SHELLCHECK,
    BASH_SHFMT,
    MARKDOWN_MARKDOWNLINT,
    YAML_PRETTIER,
    ACTION_ACTIONLINT,
    REPOSITORY_GITLEAKS,
    CREDENTIALS,
    TYPESCRIPT_ES,
  ]

BASH_SHFMT_ARGUMENTS: -i 2
BASH_SHFMT_FILE_EXTENSIONS: [.sh]
BASH_SHELLCHECK_FILE_EXTENSIONS: [.sh]

# The lockfile is generated by pnpm, do not let Prettier reformat it
YAML_PRETTIER_FILTER_REGEX_EXCLUDE: (pnpm-lock[.]yaml)

# MegaLinter counts problems that are suppressed with eslint-disable comments as errors (through the SARIF output),
# so a new eslint-disable comment fails this job. Fix the code instead of suppressing the rule.
# ESLint runs with the project's own dependencies and its config in packages/react-mla (eslint.config.mjs).
# The config imports packages that are not in the MegaLinter image, so install the workspace and use its ESLint binary.
# ESLint 10 looks up the config from the folder of each linted file and is called once for the whole project.
TYPESCRIPT_ES_RULES_PATH: packages/react-mla
TYPESCRIPT_ES_CONFIG_FILE: eslint.config.mjs
TYPESCRIPT_ES_PRE_COMMANDS:
  # The image has no corepack, install the pnpm version pinned in package.json
  - command: npm install -g pnpm@$(node -p "require('./package.json').packageManager.split('@')[1]")
    cwd: workspace
    continue_if_failed: false
  - command: pnpm install --frozen-lockfile --ignore-scripts
    cwd: workspace
    continue_if_failed: false
TYPESCRIPT_ES_CLI_EXECUTABLE: packages/react-mla/node_modules/.bin/eslint
# Same as `pnpm lint`: ESLint is called once on the source folder, not with the list of all .ts files in the repository.
# In project mode MegaLinter also appends "." (the whole repository), which includes files outside of the tsconfig, remove it.
TYPESCRIPT_ES_CLI_LINT_MODE: project
TYPESCRIPT_ES_ARGUMENTS: packages/react-mla/src --max-warnings 0
TYPESCRIPT_ES_COMMAND_REMOVE_ARGUMENTS: "."
